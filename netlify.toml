[build]
  command = "npm run build"
  publish = "dist"

# Proxy API to backend (keeps VITE_API_URL=/api working on Netlify).
# Replace BACKEND_ORIGIN in Netlify UI → Site configuration → Environment variables,
# or edit the URL below to your live API server.
[[redirects]]
  from = "/api/*"
  to = "https://rwasikh.com/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes (/login, /join-us, /app/...)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
